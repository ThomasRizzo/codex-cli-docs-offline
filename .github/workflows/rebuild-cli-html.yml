name: rebuild-cli-html
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require all 33 parts
        run: |
          count=$(ls learn.chatgpt.com/docs/codex/_rebuild/cli.html.part* 2>/dev/null | wc -l)
          echo "parts=$count"
          test "$count" -eq 33
      - run: python3 scripts/rebuild-cli-html.py
      - name: Verify size
        run: |
          size=$(wc -c < learn.chatgpt.com/docs/codex/cli.html)
          echo "size=$size"
          test "$size" -gt 300000
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add learn.chatgpt.com/docs/codex/cli.html
          git diff --cached --quiet || (git commit -m "docs: assemble rewritten cli.html" && git push)
