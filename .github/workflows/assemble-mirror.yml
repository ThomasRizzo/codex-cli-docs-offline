name: Build offline learn.chatgpt.com mirror (HTTrack)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq httrack curl perl

      - name: Seed list (site root + sitemap + llms.txt + machine-readable files)
        # HTTrack crawls from here; the sitemap/llms.txt seeds catch pages that are not
        # linked from the nav. No redirect resolution needed: HTTrack follows /codex/* 308s
        # itself and links to the canonical local file.
        run: |
          set -euo pipefail
          B=https://learn.chatgpt.com
          {
            echo "$B/"
            for f in robots.txt sitemap-index.xml chatgpt-sitemap-0.xml llms.txt llms-full.txt \
                     docs/llms.txt docs/llms-full.txt docs/codex-manual.md blog/llms.txt; do echo "$B/$f"; done
            curl -sfL "$B/sitemap-index.xml" | grep -o '<loc>[^<]*</loc>' | sed 's/<\/*loc>//g' \
              | while read -r sm; do curl -sfL "$sm" | grep -o '<loc>[^<]*</loc>' | sed 's/<\/*loc>//g'; done
            curl -sfL "$B/docs/llms.txt" | grep -oE "$B/[^) >\"]+"
          } | sort -u > /tmp/seeds.txt
          wc -l /tmp/seeds.txt

      - name: Mirror learn.chatgpt.com with HTTrack
        # -N "%h%p/%n.%t": REQUIRED. The site sends Content-Disposition: filename="<slug>"
        #   on every page, so HTTrack's default naming saves pages with NO .html extension
        #   (and collides page/dir names like docs/auth vs docs/auth/ci-cd-auth).
        # "-learn.chatgpt.com/*?*": REQUIRED. /use-cases?team=a&team=b facets explode
        #   combinatorially; ?site_locale/?surface/?export duplicates. Assets with ?v=/?dpl=
        #   are re-allowed below.
        # api/, plugins/, apps-sdk 308 off-host to developers.openai.com -> excluded (stay absolute).
        run: |
          set -euo pipefail
          rm -rf /tmp/ht && mkdir -p /tmp/ht
          httrack -%L /tmp/seeds.txt -O /tmp/ht \
            -s0 -c4 -%c5 -A2000000 -T30 -R3 -%k -n -I0 -o0 -K0 -N "%h%p/%n.%t" -%P -q -%v0 \
            -M3000000000 -m60000000 -E7200 \
            -F "Mozilla/5.0 (compatible; offline-docs-mirror; +https://github.com/${{ github.repository }})" \
            "-*" "+learn.chatgpt.com/*" \
            "-learn.chatgpt.com/api*" "-learn.chatgpt.com/plugins*" "-learn.chatgpt.com/apps-sdk*" \
            "-learn.chatgpt.com/*?*" "+learn.chatgpt.com/_astro/*" \
            "+learn.chatgpt.com/*.webp?*" "+learn.chatgpt.com/*.png?*" "+learn.chatgpt.com/*.jpg?*" "+learn.chatgpt.com/*.jpeg?*" \
            "+learn.chatgpt.com/*.svg?*" "+learn.chatgpt.com/*.gif?*" "+learn.chatgpt.com/*.css?*" "+learn.chatgpt.com/*.js?*" \
            "+learn.chatgpt.com/*.mp4?*" "+learn.chatgpt.com/*.webm?*" "+learn.chatgpt.com/*.woff2?*" \
            "+cdn.openai.com/common/fonts/*" "+i.ytimg.com/vi/*" "+i.vimeocdn.com/*"
          grep 'mirror complete' /tmp/ht/hts-log.txt || true

      - name: Fix what HTTrack leaves behind
        # 1) query-string links + data-href nav attrs -> relative local paths (uses the
        #    redirect map in hts-cache), CSS url(/...) fonts HTTrack doesn't parse,
        #    <source srcset>, and _astro files lost to Vercel deploy skew mid-crawl.
        # 2) strip per-run HTTrack timestamps, junk files, restore codex-manual.md name,
        #    fetch the unlinked .md twins, move host dirs into the repo.
        run: |
          set -euo pipefail
          bash scripts/httrack-postprocess.sh /tmp/ht .

      - name: Commit and push mirror
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"; exit 0
          fi
          DATE=$(TZ=America/New_York date '+%Y-%m-%d %H:%M %Z')
          git commit -m "Build offline learn.chatgpt.com mirror (${DATE})"
          git push
