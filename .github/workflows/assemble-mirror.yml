name: Build offline Codex docs mirror

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq wget

      - name: Build seed list from live llms.txt + nav (canonical destinations)
        # Seeds every llms.txt page plus sidebar/nav targets; /codex/* aliases are
        # resolved through their live 308s (e.g. /codex/resources -> /resources,
        # /codex/auth -> /docs/auth). Never invents docs/codex/... paths.
        # Also writes scripts/codex-redirects.json for the URL rewriter.
        run: python3 scripts/build-seeds.py .

      - name: Mirror Codex docs from learn.chatgpt.com
        run: |
          set -euo pipefail
          rm -rf learn.chatgpt.com staging
          mkdir -p staging
          # Pages without an extension are rejected by -A during recursion, so the
          # crawl stays limited to the seeded pages plus their assets.
          wget --mirror --convert-links --adjust-extension --page-requisites --no-parent \
            --domains=learn.chatgpt.com \
            -e robots=off \
            --timeout=30 --tries=3 --wait=0.1 \
            --exclude-directories=/api,/ads,/blog \
            -A 'html,css,js,png,jpg,jpeg,svg,woff,woff2,gif,webp,ico,txt,xml,md' \
            -i /tmp/urls.txt \
            -P staging -nv || true
          # wget saves extensionless seeds as *.tmp.html and --convert-links points
          # hrefs at those names; rename the files AND fix the hrefs.
          find staging -name '*.tmp.html' -print0 | while IFS= read -r -d '' f; do
            mv "$f" "${f%.tmp.html}.html"
          done
          find staging -type f \( -name '*.html' -o -name '*.css' -o -name '*.js' -o -name '*.md' -o -name '*.txt' \) -print0 \
            | xargs -0 -r sed -i 's/\.tmp\.html/.html/g'
          if [ -d staging/learn.chatgpt.com ]; then
            rm -rf learn.chatgpt.com
            mv staging/learn.chatgpt.com .
          fi
          rm -rf staging
          if [ ! -f index.html ]; then
            printf '%s\n' '<!DOCTYPE html><html><head><meta charset="utf-8"><meta http-equiv="refresh" content="0;url=learn.chatgpt.com/docs/codex/cli.html"><title>Codex CLI Docs Offline</title></head><body><p><a href="learn.chatgpt.com/docs/codex/cli.html">Open Codex CLI docs</a></p></body></html>' > index.html
          fi
          echo "=== Mirror stats ==="
          find learn.chatgpt.com -type f 2>/dev/null | wc -l
          du -sh learn.chatgpt.com 2>/dev/null || true
          ls learn.chatgpt.com/docs/auth.html learn.chatgpt.com/docs/quickstart.html \
            learn.chatgpt.com/docs/administration.html learn.chatgpt.com/docs/changelog.html \
            learn.chatgpt.com/resources.html learn.chatgpt.com/use-cases.html \
            learn.chatgpt.com/videos.html 2>/dev/null || true

      - name: Rewrite Learn URLs to relative paths
        run: bash scripts/make-urls-relative.sh

      - name: Commit and push mirror
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          DATE=$(TZ=America/New_York date '+%Y-%m-%d %H:%M %Z')
          git commit -m "Build offline Codex docs mirror (${DATE})"
          git push
