name: Assemble offline mirror from b64 parts

on:
  workflow_dispatch:
  push:
    paths:
      - 'upload-parts/**'
      - '.github/workflows/assemble-mirror.yml'

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble tarball and extract
        run: |
          set -euo pipefail
          if [ ! -d upload-parts ]; then
            echo "No upload-parts/; nothing to assemble"
            exit 0
          fi
          cat upload-parts/part-*.b64 | base64 -d > /tmp/mirror.tar.gz
          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name 'upload-parts' ! -name '.github' -exec rm -rf {} +
          tar -xzf /tmp/mirror.tar.gz
          rm -rf upload-parts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short | head -50
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Assemble full offline Codex docs mirror from uploaded parts"
          git push
