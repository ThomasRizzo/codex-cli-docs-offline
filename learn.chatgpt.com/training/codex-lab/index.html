      (() => {
        const root = document.documentElement;
        let websiteRoot = null;

        try {
          websiteRoot = window.parent.document.documentElement;
        } catch {
          // Keep the course readable if it cannot inspect its parent page.
        }

        const theme = websiteRoot?.dataset.theme === "dark"
          || websiteRoot?.classList.contains("dark") ? "dark" : "light";

        root.dataset.trainingEmbedded = "true";
        root.dataset.theme = theme;
        root.classList.toggle("dark", theme === "dark");
        root.style.colorScheme = theme;
        document.querySelector('meta[name="theme-color"]')?.setAttribute(
          "content",
          theme === "dark" ? "#000000" : "#ffffff",
        );
      })();
