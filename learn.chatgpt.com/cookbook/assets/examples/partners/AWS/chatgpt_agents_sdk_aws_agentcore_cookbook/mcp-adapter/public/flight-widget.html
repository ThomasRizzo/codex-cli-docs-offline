    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Flight status</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        --widget-safe-area: 20px;
        --eliza-charcoal: #3A3A3A;
        --eliza-white: #FFFFFF;
        --eliza-accent-1: #F6D2C5;
        --eliza-accent-2: #DFC2B8;
        --eliza-accent-3: #EE9F84;
        --eliza-accent-4: #D84D1E;
      }
      * { box-sizing: border-box; }
      body { margin: 0; background: transparent; color: var(--eliza-charcoal); }
      main {
        display: grid;
        gap: 10px;
        min-width: 0;
        padding: var(--widget-safe-area);
        background: var(--eliza-white);
        border-radius: 16px;
      }
      header { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; min-width: 0; }
      h1 {
        margin: 0;
        color: var(--eliza-charcoal);
        font-family: "Libre Baskerville", Georgia, serif;
        font-size: 1rem;
        font-weight: 700;
      }
      .provider {
        border-radius: 999px;
        background: var(--eliza-accent-1);
        color: var(--eliza-charcoal);
        font-size: 0.72rem;
        font-weight: 650;
        padding: 3px 7px;
        white-space: nowrap;
      }
      .message { margin: 0; color: var(--eliza-charcoal); font-size: 0.86rem; }
      .cards { display: grid; gap: 8px; }
      .card {
        border: 1px solid var(--eliza-accent-2);
        border-radius: 12px;
        padding: 12px;
        background: var(--eliza-white);
      }
      .route { display: flex; align-items: center; gap: 8px; font-weight: 650; }
      .arrow { color: var(--eliza-accent-4); }
      .details { display: flex; flex-wrap: wrap; gap: 8px 14px; margin-top: 8px; color: var(--eliza-charcoal); font-size: 0.8rem; }
      .status {
        border-inline-start: 3px solid var(--eliza-accent-3);
        color: var(--eliza-charcoal);
        font-weight: 700;
        padding-inline-start: 6px;
      }
      .error {
        border-inline-start: 3px solid var(--eliza-accent-4);
        color: var(--eliza-charcoal);
        font-weight: 700;
        padding-inline-start: 6px;
      }
    </style>
  </head>
  <body><!--ob--><div id="ob" role="note" data-pagefind-ignore data-root="../../../../../../../../../"></div><script>(function(){var K="offline-banner:codex-cli-docs-offline",d=document.documentElement,b=document.getElementById("ob"),u=new URL(b.getAttribute("data-root")+"banner.txt",location.href).href,c=null;function put(t){b.innerHTML=t;var a=b.querySelectorAll("a[href]");for(var i=0;i<a.length;i++){var h=a[i].getAttribute("href");if(!/^([a-z][a-z0-9+.-]*:|\/|#)/i.test(h))a[i].href=new URL(h,u).href}b.title=b.textContent;d.classList.add("ob-on")}function off(){d.classList.remove("ob-on");b.innerHTML=""}try{c=localStorage.getItem(K)}catch(e){}if(c)put(c);if(!window.fetch)return;fetch(u,{cache:"no-cache",credentials:"same-origin"}).then(function(r){return r.ok?r.text():""}).then(function(t){t=(t||"").replace(/^\uFEFF/,"").trim();if(/^<(!doctype|html)/i.test(t))t="";if(t!==c){t?put(t):off();try{localStorage.setItem(K,t)}catch(e){}}},function(){if(!c)off()})})()</script><!--/ob-->
    <main aria-live="polite">
      <header>
        <h1>Eliza Airlines flight information</h1>
        <span class="provider">Cookbook agent</span>
      </header>
      <p id="message" class="message">Waiting for a flight tool result…</p>
      <section id="cards" class="cards"></section>
    </main>
    <script type="module">
      const messageEl = document.querySelector("#message");
      const cardsEl = document.querySelector("#cards");

      const addText = (parent, className, value) => {
        const element = document.createElement("span");
        element.className = className;
        element.textContent = String(value ?? "");
        parent.appendChild(element);
      };

      const renderFlight = (flight, statusMode) => {
        const card = document.createElement("article");
        card.className = "card";
        const route = document.createElement("div");
        route.className = "route";
        addText(route, "flight-number", flight.flightNumber);
        addText(route, "airport", flight.origin);
        addText(route, "arrow", "→");
        addText(route, "airport", flight.destination);
        card.appendChild(route);

        const details = document.createElement("div");
        details.className = "details";
        addText(details, "date", flight.travelDate);
        if (statusMode) {
          addText(details, "status", `Status: ${flight.status || "unknown"}`);
          addText(details, "summary", flight.summary);
        } else {
          addText(details, "time", `${flight.departTime}–${flight.arriveTime}`);
          addText(details, "fare", `$${flight.fareUsd}`);
        }
        card.appendChild(details);
        cardsEl.appendChild(card);
      };

      const render = (payload) => {
        cardsEl.replaceChildren();
        messageEl.classList.remove("error");
        if (!payload || typeof payload !== "object") {
          messageEl.textContent = "No flight result was returned.";
          return;
        }
        if (payload.action === "search_flights" && Array.isArray(payload.flights)) {
          messageEl.textContent = payload.summary || `${payload.flights.length} options found.`;
          payload.flights.forEach((flight) => renderFlight(flight, false));
          return;
        }
        if ((payload.action === "get_upcoming_status" || payload.action === "get_live_status") && payload.flight) {
          messageEl.textContent = payload.flight.summary || "Flight status ready.";
          renderFlight(payload.flight, true);
          return;
        }
        messageEl.textContent = "The flight result did not match the expected schema.";
        messageEl.classList.add("error");
      };

      let rpcId = 0;
      const pending = new Map();
      const request = (method, params) => new Promise((resolve, reject) => {
        const id = ++rpcId;
        pending.set(id, { resolve, reject });
        window.parent.postMessage({ jsonrpc: "2.0", id, method, params }, "*");
      });
      const notify = (method, params) => {
        window.parent.postMessage({ jsonrpc: "2.0", method, params }, "*");
      };

      window.addEventListener("message", (event) => {
        if (event.source !== window.parent) return;
        const packet = event.data;
        if (!packet || packet.jsonrpc !== "2.0") return;
        if (typeof packet.id === "number") {
          const waiter = pending.get(packet.id);
          if (!waiter) return;
          pending.delete(packet.id);
          packet.error ? waiter.reject(packet.error) : waiter.resolve(packet.result);
          return;
        }
        if (packet.method === "ui/notifications/tool-result") {
          render(packet.params?.structuredContent);
        }
      }, { passive: true });

      try {
        await request("ui/initialize", {
          appInfo: { name: "flight-status-widget", version: "1.0.0" },
          appCapabilities: {},
          protocolVersion: "2026-01-26"
        });
        notify("ui/notifications/initialized", {});
      } catch (error) {
        messageEl.textContent = "Unable to initialize the widget bridge.";
        messageEl.classList.add("error");
        console.error(error);
      }

      if (window.openai?.toolOutput) render(window.openai.toolOutput);
    </script>
  </body>

</html>
